name: edp
# NOTE: torch/torchvision are installed via pip (see below), not conda.
# Pulling them from the `pytorch` conda channel alongside conda-forge
# caused an MKL/OpenMP DLL version mismatch on Windows (fbgemm.dll failed
# to load, WinError 182). The official wheels from download.pytorch.org
# bundle a self-contained runtime and avoid this.
#
# GPU (recommended, if an NVIDIA GPU is present — training a YOLO detector
# on CPU is viable but slow, ~3.2-3.5h for 40 epochs on ~600-1200 images
# vs. dramatically less on a GPU):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
# CPU-only fallback (what the pip block below installs by default):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
# scripts/train_yolo.py auto-detects CUDA and uses it when available.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - opencv
  - scikit-image
  - scikit-learn
  - networkx
  - matplotlib
  - lxml
  - tesseract
  - pillow
  - pyyaml
  - pytest
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision
      - pydantic>=2
      - pytesseract
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - transformers
      - ultralytics
      - faiss-cpu
