<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Electrical Drawing Interpretation Pipeline</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --border: #2a2f3d;
    --text: #e6e8ef;
    --muted: #9aa1b2;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  input[type="file"] { color: var(--muted); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 57px);
  }
  section {
    background: var(--bg);
    overflow: auto;
    padding: 16px;
  }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-size: 12px;
    line-height: 1.5;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  .status { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Electrical Drawing Interpretation Pipeline</h1>
  <div class="controls">
    <input id="file" type="file" accept="image/*" />
    <button id="run">Process</button>
    <span id="status" class="status"></span>
  </div>
</header>
<main>
  <section>
    <h2>JSON</h2>
    <div id="json-out"><div class="empty">Upload a drawing and click Process.</div></div>
  </section>
  <section>
    <h2>Graph</h2>
    <div id="graph-out"><div class="empty">&nbsp;</div></div>
  </section>
</main>
<script>
const fileInput = document.getElementById('file');
const runBtn = document.getElementById('run');
const statusEl = document.getElementById('status');
const jsonOut = document.getElementById('json-out');
const graphOut = document.getElementById('graph-out');

runBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) { statusEl.textContent = 'choose a file first'; return; }

  runBtn.disabled = true;
  statusEl.textContent = 'processing...';
  jsonOut.innerHTML = '<div class="empty">Running pipeline...</div>';
  graphOut.innerHTML = '';

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch('/api/process', { method: 'POST', body: form });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const data = await res.json();

    jsonOut.innerHTML = '';
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(data.json, null, 2);
    jsonOut.appendChild(pre);

    graphOut.innerHTML = '';
    const img = document.createElement('img');
    img.src = data.graph_png;
    graphOut.appendChild(img);

    const timingLine = Object.entries(data.timing || {})
      .map(([k, v]) => `${k}: ${v}s`).join(' · ');
    statusEl.textContent = timingLine || 'done';
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
    jsonOut.innerHTML = `<div class="empty">${err.message}</div>`;
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
