[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edp"
version = "0.2.0"
description = "Electrical Drawing Interpretation Pipeline"
requires-python = ">=3.10"

[project.scripts]
edp = "edp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
