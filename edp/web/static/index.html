<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Electrical Drawing Interpretation Pipeline</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161923; --border: #2a2f3d;
    --text: #e6e8ef; --muted: #9aa1b2; --accent: #5b9dff;
    --jk: #7ec1ff; --js: #9fd88a; --jn: #f2b366; --jb: #d78bf0; --jp: #5c6376;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  input[type="file"] { color: var(--muted); font-size: 13px; }
  button { background: var(--accent); color: #fff; border: none; padding: 7px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.on { color: var(--accent); border-color: var(--accent); }
  .status { color: var(--muted); font-size: 12px; max-width: 40ch; }
  main { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; background: var(--border); height: calc(100vh - 52px); }
  section { background: var(--bg); overflow: hidden; padding: 14px; display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; flex: none; display: flex; justify-content: space-between; }
  section h2 .count { color: var(--accent); }
  .body { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: flex-start; justify-content: center; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; border: 1px solid var(--border); }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 12px; line-height: 1.55; overflow: auto; white-space: pre; width: 100%; margin: 0; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .jk{color:var(--jk)} .js{color:var(--js)} .jn{color:var(--jn)} .jb{color:var(--jb)} .jp{color:var(--jp)}
  .empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; margin: auto; }

  /* detected-components panel: overlay on top, list below */
  .detected { flex-direction: column; align-items: stretch; gap: 10px; }
  .detected .overlay-wrap { flex: 1 1 55%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .detected table { flex: 1 1 45%; overflow: auto; display: block; border-collapse: collapse; font-size: 12px; width: 100%; }
  .detected th { position: sticky; top: 0; background: var(--bg); text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .detected td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .detected tr:hover td { background: var(--panel); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  /* graph */
  #graph-out { position: relative; display: block; padding: 0; overflow: hidden; }
  #graph-svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; background: #0c0e13; }
  #graph-svg line { stroke: #5b6577; stroke-width: 1.6; }
  #graph-svg line.sep { stroke: var(--border); stroke-dasharray: 4 4; }
  #graph-svg circle { stroke: #0c0e13; stroke-width: 2; cursor: grab; }
  #graph-svg .nid   { fill: var(--text); font: 600 12px ui-monospace, Consolas, monospace; pointer-events: none; }
  #graph-svg .ntype { fill: var(--muted); font: 10px ui-monospace, Consolas, monospace; pointer-events: none; }
  #graph-svg .cap   { fill: var(--muted); font: 11px -apple-system, Segoe UI, sans-serif; }
  .graph-bar { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
  .graph-bar button { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 3px 9px; font-size: 13px; border-radius: 5px; min-width: 26px; }
</style>
</head>
<body>
<header>
  <h1>Electrical Drawing Interpretation Pipeline</h1>
  <span id="domain" class="badge">domain: —</span>
  <div class="controls">
    <input id="file" type="file" accept="image/*" />
    <button id="run">Process</button>
    <span id="status" class="status"></span>
  </div>
</header>
<main>
  <section>
    <h2>Input Diagram</h2>
    <div class="body" id="input-out"><div class="empty">Choose a drawing and click Process.</div></div>
  </section>

  <section>
    <h2><span>Detected Components</span><span class="count" id="sym-count"></span></h2>
    <div class="body detected" id="detected-out"><div class="empty">&nbsp;</div></div>
  </section>

  <section>
    <h2><span>JSON (id · type · coordinates · connections)</span></h2>
    <div class="body" id="json-out"><div class="empty">&nbsp;</div></div>
  </section>

  <section>
    <h2><span>Connectivity Graph</span><span class="count" id="edge-count"></span></h2>
    <div class="body" id="graph-out"><div class="empty">&nbsp;</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fileInput = $('file'), runBtn = $('run'), statusEl = $('status'), domainEl = $('domain');

// brgb palette matching the server overlay (server uses BGR; here RGB)
const PALETTE = ['#5b9dff','#9fd88a','#f2b366','#d78bf0','#7ec1ff','#ff8c5a','#78c8a0','#f08282'];
const colorForType = (type, types) =>
  type === 'Unknown' ? '#ff5555' : PALETTE[types.indexOf(type) % PALETTE.length];

function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function highlightJson(value){
  const text = escapeHtml(JSON.stringify(value, null, 2));
  return text.replace(
    /(&quot;(?:\\.|[^&"\\])*&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g,
    (m, str, isKey, bool, num) => {
      if (str) return isKey ? `<span class="jk">${str}</span><span class="jp">${isKey}</span>` : `<span class="js">${str}</span>`;
      if (bool) return `<span class="jb">${bool}</span>`;
      if (num)  return `<span class="jn">${num}</span>`;
      return m;
    });
}

function showImage(container, src){
  container.innerHTML = '';
  const img = document.createElement('img');
  img.src = src;
  container.appendChild(img);
}

function renderDetected(container, symbols, types){
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'overlay-wrap';
  const img = document.createElement('img');
  img.id = 'overlay-img';
  wrap.appendChild(img);
  container.appendChild(wrap);

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>id</th><th>type</th><th>connections</th></tr></thead>';
  const tb = document.createElement('tbody');
  for (const s of symbols){
    const tr = document.createElement('tr');
    const c = colorForType(s.type, types);
    tr.innerHTML =
      `<td>${s.id}</td>` +
      `<td><span class="swatch" style="background:${c}"></span>${s.type}</td>` +
      `<td>${s.connections.length ? s.connections.join(', ') : '<span style="color:var(--muted)">—</span>'}</td>`;
    tb.appendChild(tr);
  }
  table.appendChild(tb);
  container.appendChild(table);
  return img; // caller sets .src once the overlay data-url is known
}

// --- dependency-free force-directed graph: pan (drag bg) + zoom (wheel),
//     connected nodes force-laid, unconnected nodes in a tidy grid below ---
const svgNS = 'http://www.w3.org/2000/svg';
const W = 1000, H = 680, R = 11;

function renderGraph(container, symbols){
  container.innerHTML = '';
  if (!symbols.length){ container.innerHTML = '<div class="empty">no components</div>'; return; }

  let isoStripY = 0;
  const types = [...new Set(symbols.map(s => s.type))].sort();
  const idIndex = new Map(symbols.map((s, i) => [s.id, i]));
  const nodes = symbols.map(s => ({ id: s.id, type: s.type, x: 0, y: 0, fx: 0, fy: 0, deg: 0 }));

  const edgeSet = new Set(), edges = [];
  for (const s of symbols){
    for (const other of s.connections){
      if (!idIndex.has(other)) continue;
      const a = idIndex.get(s.id), b = idIndex.get(other);
      if (a === b) continue;
      const key = a < b ? `${a}-${b}` : `${b}-${a}`;
      if (edgeSet.has(key)) continue;
      edgeSet.add(key);
      edges.push([Math.min(a, b), Math.max(a, b)]);
      nodes[a].deg++; nodes[b].deg++;
    }
  }
  $('edge-count').textContent = `${edges.length} edges`;

  // adjacency + connected components (BFS)
  const adj = nodes.map(() => []);
  for (const [a, b] of edges){ adj[a].push(b); adj[b].push(a); }
  const comp = nodes.map(() => -1);
  const comps = [];
  for (let i = 0; i < nodes.length; i++){
    if (comp[i] !== -1) continue;
    const q = [i], members = []; comp[i] = comps.length;
    while (q.length){
      const u = q.pop(); members.push(u);
      for (const v of adj[u]) if (comp[v] === -1){ comp[v] = comps.length; q.push(v); }
    }
    comps.push(members);
  }
  const multi    = comps.filter(c => c.length > 1);
  const isolated = comps.filter(c => c.length === 1).map(c => nodes[c[0]]);

  // force-layout each multi-node component on its own, then fit it into a cell
  function layoutComponent(members){
    const local = members.map(idx => nodes[idx]);
    local.forEach((n, i) => {
      n.x = Math.cos(i / local.length * 6.283) * 120 + (Math.random() - .5) * 30;
      n.y = Math.sin(i / local.length * 6.283) * 120 + (Math.random() - .5) * 30;
    });
    const K = 70, ITER = 500;
    const inSet = new Set(members);
    for (let it = 0; it < ITER; it++){
      const t = 1 - it / ITER;
      for (const n of local){ n.fx = 0; n.fy = 0; }
      for (let i = 0; i < local.length; i++)
        for (let j = i + 1; j < local.length; j++){
          let dx = local[i].x - local[j].x, dy = local[i].y - local[j].y;
          let d = Math.hypot(dx, dy) || .01;
          const f = (K * K) / d;
          local[i].fx += dx/d*f; local[i].fy += dy/d*f;
          local[j].fx -= dx/d*f; local[j].fy -= dy/d*f;
        }
      for (const [a, b] of edges){
        if (!inSet.has(a) || !inSet.has(b)) continue;
        const na = nodes[a], nb = nodes[b];
        let dx = nb.x - na.x, dy = nb.y - na.y;
        const d = Math.hypot(dx, dy) || .01;
        const f = Math.min((d * d) / K, 40);
        na.fx += dx/d*f; na.fy += dy/d*f;
        nb.fx -= dx/d*f; nb.fy -= dy/d*f;
      }
      for (const n of local){
        n.fx += -n.x * 0.03; n.fy += -n.y * 0.03;
        const mag = Math.hypot(n.fx, n.fy) || 1;
        n.x += n.fx/mag * Math.min(mag, 9 * t + 1);
        n.y += n.fy/mag * Math.min(mag, 9 * t + 1);
      }
    }
  }
  multi.forEach(layoutComponent);

  // position each component (at its natural force-layout scale) so they
  // don't overlap: pack left-to-right, wrap to a new row, then drop the
  // isolated nodes into a grid underneath
  const GAP = 70;
  let curX = 0, curY = 0, rowH = 0, maxX = 0;
  const bboxOf = list => {
    const xs = list.map(n => n.x), ys = list.map(n => n.y);
    return { mnx: Math.min(...xs), mny: Math.min(...ys), mxx: Math.max(...xs), mxy: Math.max(...ys) };
  };
  multi.sort((a, b) => b.length - a.length);
  for (const members of multi){
    const local = members.map(i => nodes[i]);
    const bb = bboxOf(local);
    const w = bb.mxx - bb.mnx, h = bb.mxy - bb.mny;
    if (curX > 0 && curX + w > 1400){ curX = 0; curY += rowH + GAP; rowH = 0; }
    const dx = curX - bb.mnx, dy = curY - bb.mny;
    for (const n of local){ n.x += dx; n.y += dy; }
    curX += w + GAP; rowH = Math.max(rowH, h); maxX = Math.max(maxX, curX);
  }
  if (isolated.length){
    const stripY = curY + rowH + (multi.length ? GAP + 20 : 0);
    isoStripY = stripY;
    const cols = Math.max(4, Math.min(isolated.length, Math.round(maxX / 150) || 8));
    isolated.forEach((n, i) => {
      n.x = (i % cols) * 150;
      n.y = stripY + 24 + Math.floor(i / cols) * 60;
    });
  }

  // --- build SVG; viewBox = content bounds so it fits by default,
  //     preserveAspectRatio letterboxes it into whatever the panel is ---
  const gx = nodes.map(n => n.x), gy = nodes.map(n => n.y);
  const vbx = Math.min(...gx) - 90, vby = Math.min(...gy) - 40;
  const vbw = (Math.max(...gx) + 160) - vbx, vbh = (Math.max(...gy) + 50) - vby;
  const svg = document.createElementNS(svgNS, 'svg');
  svg.id = 'graph-svg';
  svg.setAttribute('viewBox', `${vbx} ${vby} ${vbw} ${vbh}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  const vp = document.createElementNS(svgNS, 'g');   // pan/zoom target
  svg.appendChild(vp);

  if (isolated.length && multi.length){
    const sepY = isoStripY - 4;
    const xs = nodes.map(n => n.x);
    const sep = document.createElementNS(svgNS, 'line');
    sep.setAttribute('x1', Math.min(...xs) - 20); sep.setAttribute('x2', Math.max(...xs) + 20);
    sep.setAttribute('y1', sepY); sep.setAttribute('y2', sepY);
    sep.setAttribute('class', 'sep');
    vp.appendChild(sep);
    const cap = document.createElementNS(svgNS, 'text');
    cap.setAttribute('x', Math.min(...xs) - 20); cap.setAttribute('y', sepY - 6);
    cap.setAttribute('class', 'cap');
    cap.textContent = `unconnected (${isolated.length})`;
    vp.appendChild(cap);
  }

  const lineEls = edges.map(([a, b]) => {
    const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', nodes[a].x); l.setAttribute('y1', nodes[a].y);
    l.setAttribute('x2', nodes[b].x); l.setAttribute('y2', nodes[b].y);
    l.dataset.a = a; l.dataset.b = b;
    vp.appendChild(l);
    return l;
  });

  nodes.forEach((n, i) => {
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node');
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('r', R);
    c.setAttribute('fill', colorForType(n.type, types));
    const t1 = document.createElementNS(svgNS, 'text');   // id
    t1.setAttribute('class', 'nid');
    t1.textContent = n.id;
    const t2 = document.createElementNS(svgNS, 'text');   // type
    t2.setAttribute('class', 'ntype');
    t2.textContent = n.type;
    g.append(c, t1, t2);
    vp.appendChild(g);
    n._els = { g, c, t1, t2 };
    place(n);

    let dragging = false;
    c.addEventListener('pointerdown', e => {
      e.stopPropagation(); dragging = true; c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointerup', e => { dragging = false; });
    c.addEventListener('pointermove', e => {
      if (!dragging) return;
      const p = toLocal(e); n.x = p.x; n.y = p.y; place(n);
      for (const l of lineEls){
        if (+l.dataset.a === i){ l.setAttribute('x1', n.x); l.setAttribute('y1', n.y); }
        if (+l.dataset.b === i){ l.setAttribute('x2', n.x); l.setAttribute('y2', n.y); }
      }
    });
  });

  function place(n){
    n._els.c.setAttribute('cx', n.x); n._els.c.setAttribute('cy', n.y);
    n._els.t1.setAttribute('x', n.x + R + 4); n._els.t1.setAttribute('y', n.y - 1);
    n._els.t2.setAttribute('x', n.x + R + 4); n._els.t2.setAttribute('y', n.y + 10);
  }

  // --- pan + zoom: a transform on vp, on top of the fit-by-default viewBox ---
  let k = 1, tx = 0, ty = 0;
  const apply = () => vp.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`);
  const fitView = () => { k = 1; tx = 0; ty = 0; apply(); };
  function toLocal(e){
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(vp.getScreenCTM().inverse());
  }
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const before = toLocal(e);
    k = Math.max(0.25, Math.min(6, k * (e.deltaY < 0 ? 1.15 : 1/1.15)));
    apply();
    const after = toLocal(e);
    tx += (after.x - before.x) * k; ty += (after.y - before.y) * k;
    apply();
  }, { passive: false });
  let panning = false, px = 0, py = 0;
  svg.addEventListener('pointerdown', e => { panning = true; px = e.clientX; py = e.clientY; svg.style.cursor = 'grabbing'; });
  svg.addEventListener('pointerup',   () => { panning = false; svg.style.cursor = 'grab'; });
  svg.addEventListener('pointerleave',() => { panning = false; });
  svg.addEventListener('pointermove', e => {
    if (!panning) return;
    tx += e.clientX - px; ty += e.clientY - py; px = e.clientX; py = e.clientY; apply();
  });

  // toolbar
  const bar = document.createElement('div');
  bar.className = 'graph-bar';
  const mk = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; return b; };
  const zoomAt = f => { k = Math.max(0.25, Math.min(6, k * f)); apply(); };
  bar.append(
    mk('+', () => zoomAt(1.25)),
    mk('−', () => zoomAt(1/1.25)),
    mk('fit', fitView),
  );

  container.append(bar, svg);
  apply();
}

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) showImage($('input-out'), URL.createObjectURL(f));
});

runBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file){ statusEl.textContent = 'choose a file first'; return; }

  runBtn.disabled = true;
  statusEl.textContent = 'processing…';
  domainEl.textContent = 'domain: …'; domainEl.classList.remove('on');
  for (const id of ['detected-out','json-out','graph-out'])
    $(id).innerHTML = '<div class="empty">running pipeline…</div>';
  $('sym-count').textContent = ''; $('edge-count').textContent = '';

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch('/api/process', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    showImage($('input-out'), data.original_png);

    const symbols = data.json.symbols;
    const types = [...new Set(symbols.map(s => s.type))].sort();
    $('sym-count').textContent = `${symbols.length} symbols`;
    domainEl.textContent = `domain: ${data.domain || '?'}`;
    domainEl.classList.add('on');

    const overlayImg = renderDetected($('detected-out'), symbols, types);
    overlayImg.src = data.overlay_png;

    $('json-out').innerHTML = '';
    const pre = document.createElement('pre');
    pre.innerHTML = highlightJson(data.json);
    $('json-out').appendChild(pre);

    renderGraph($('graph-out'), symbols);

    const t = Object.entries(data.timing || {}).map(([k, v]) => `${k} ${v}s`).join(' · ');
    statusEl.textContent = t || 'done';
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
    $('json-out').innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
