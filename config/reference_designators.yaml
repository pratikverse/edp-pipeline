# OCR text -> classification prior (docs/08_improvement_plan.md, classification
# evidence architecture). Two independent tables, checked in this order:
#
#   1. part_number_families — exact/family part-number patterns. Far more
#      specific than a one-letter designator, so these win when both match
#      (e.g. "T2BC547" matches designator "T" -- which is deliberately blank,
#      see below -- AND part family "BC547" -> BJT_NPN; the part family wins).
#   2. designators — the reference-designator letter prefix (IEC 61346 /
#      ANSI Y32.2 convention: R1, C3, ZD1, ...). Weaker, more general evidence.
#
# Both are priors, not ground truth — text/priors.py gates their strength by
# how exact the match was (see EvidenceLevel in classify/text_prior.py) and
# fusion never lets weak OCR evidence override confident visual evidence.
#
# Extend by adding entries here — no code change needed for a new family or
# designator, per the "declarative, not hardcoded in inference logic" rule.

designators:
  # letter-prefix -> {class_name: prior_weight}. A single class at 1.0 is an
  # unambiguous designator; multiple classes splitting the weight is an
  # intentionally honest prior for a designator that's genuinely ambiguous
  # by convention (e.g. "C" for both plain and polarized capacitors).
  R:    {Resistor: 1.0}
  RV:   {Potentiometer: 1.0}
  POT:  {Potentiometer: 1.0}
  C:    {Capacitor: 0.5, Capacitor_Polarized: 0.5}
  L:    {Inductor: 1.0}
  D:    {Diode: 1.0}
  ZD:   {Zener: 1.0}
  Q:    {BJT_NPN: 0.5, BJT_PNP: 0.5}
  K:    {Relay: 1.0}
  BT:   {Battery: 1.0}
  BATT: {Battery: 1.0}
  SW:   {Switch: 1.0}
  S:    {Switch: 1.0}
  Y:    {Crystal: 1.0}
  X:    {Crystal: 1.0}
  XTAL: {Crystal: 1.0}
  ANT:  {Antenna: 1.0}
  F:    {Fuse: 1.0}
  TR:   {Transformer: 1.0}
  XFMR: {Transformer: 1.0}
  LED:  {LED: 1.0}
  # "T" is deliberately absent: in this project's own validation drawings it
  # means Transformer (D5's T1) *and* Transistor (D4's T1/T2/T3) -- a prior
  # here would be wrong roughly half the time by the convention actually
  # observed, so it's left to visual evidence and part-number matching alone.
  # "U" (generic IC) is likewise absent -- it covers far more real-world
  # classes than this library models; a forced prior toward the one IC-like
  # class we have (Optocoupler) would be a guess dressed up as a designator.

part_number_families:
  # pattern is matched case-insensitively anywhere in the normalised OCR
  # text (not just at the start), since OCR often concatenates designator
  # and part number with no space ("T2BC547").
  - pattern: 'BC5(4[6-9]|50)[A-Z]?'      # BC546-BC550
    class: BJT_NPN
  - pattern: 'BC5(5[6-9]|60)[A-Z]?'      # BC556-BC560
    class: BJT_PNP
  - pattern: 'BC337'
    class: BJT_NPN
  - pattern: 'BC327'
    class: BJT_PNP
  - pattern: '2N(2222|3904|4401|5088)A?'
    class: BJT_NPN
  - pattern: '2N(2907|3906|4403|5087)A?'
    class: BJT_PNP
  - pattern: 'MPSH11'
    class: BJT_NPN
  - pattern: '1N4(148|001|002|003|004|005|006|007)'
    class: Diode
  - pattern: '1N914'
    class: Diode
  - pattern: '1N47(2[89]|[3-5]\d|6[0-4])'  # 1N4728-1N4764 Zener family
    class: Zener
  - pattern: 'IR?F?540'                    # IRF540 / IR540 (OCR sometimes drops the F)
    class: MOSFET_N
  - pattern: 'MCT2E'
    class: Optocoupler
  - pattern: '4N2[5-8]'                    # 4N25-4N28
    class: Optocoupler
  - pattern: '4N3[5-7]'                    # 4N35-4N37
    class: Optocoupler
  - pattern: '6N13[5-9]'                   # 6N135-6N139
    class: Optocoupler
