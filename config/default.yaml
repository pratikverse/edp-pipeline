# All pipeline thresholds live here, never inline in code (docs/07_project_layout.md).

preprocess:
  binarize_block_size: 31   # adaptive threshold neighbourhood, must be odd
  binarize_c: 7              # adaptive threshold constant subtracted from mean
  denoise: true
  denoise_min_speckle_area: 2 # px; connected components smaller than this are dropped
  deskew_max_angle_deg: 5
  color_layer_split: true    # separate blue/black strokes where present (D5)

localize:
  min_component_area: 80
  max_component_area: 40000
  dash_close_kernel: 5        # morphological closing kernel size, dashed boundaries
  thin_stroke_max_width: 4    # px; used only for the wire/symbol area-fraction kind hint
  density_window: 25          # px; box-filter window for skeleton corner/endpoint density
  density_threshold: 3        # min interest points in window to seed a symbol region
  density_merge_kernel: 9     # px; dilation to merge a symbol's own fragmented density blobs
  candidate_bbox_pad: 4       # px; padding added around each density-blob bbox
  candidate_merge_overlap: 0.5 # union candidates overlapping more than this (of the smaller box)
  use_yolo: true                # experimental branch: YOLO localizer instead of skeleton-density
  yolo_weights: outputs/yolo_runs/symbol_detector_mixed/weights/best.pt  # 17-class model, still the shipped default.
  # A 21-class retrain exists (symbol_detector_mixed_v2, docs/08 Phase 1.2: adds Optocoupler/
  # Potentiometer/Relay/Load + Battery/Transformer style variants) with strong synthetic-val
  # mAP50 (>0.98 on every new class) but a MEASURED real-world regression on D4 via `edp eval`
  # (detection F1 0.914->0.686: Switch/Capacitor_Polarized/Battery boxes that used to be found
  # confidently now top out at conf 0.02-0.10 and are misclassified). Root cause is believed to
  # be yolov8n's fixed 3M-param capacity being spread thinner across 21 classes rather than
  # anything wrong with the new classes themselves — not swapped in as default until that's
  # fixed (more epochs / more per-class data / a larger backbone) and re-verified against
  # data/golden/. See docs/08_improvement_plan.md section 1.2.
  yolo_conf_threshold: 0.12  # lowered from 0.25 - was a recall bottleneck, verified on D5
  yolo_iou_threshold: 0.45

classify:
  model: dinov2_vitb14   # 768-dim (DINOv2-base)
  embedding_dim: 768
  rotations: [0, 90, 180, 270]
  mirror: true
  unknown_similarity_threshold: 0.62
  reference_dir: data/reference
  # Evidence-fusion weights (classify/evidence.py, classify/match.py). Empty ->
  # code defaults (yolo 1.2, dinov2 1.0, text_prior 1.0). Override individual
  # sources here, e.g. `evidence_weights: {text_prior: 1.5}`.
  evidence_weights: {}
  reference_designators_path: config/reference_designators.yaml
  ambiguity_margin_threshold: 0.15  # reserved for confusion-pair specialist routing (unused until one exists)
  probe_model_path: outputs/probe/linear_probe.joblib  # docs/08 Phase 7; abstains if this file doesn't exist

text:
  upscale_factor: 3
  orientations: [0, 90, 270]
  max_association_distance: 45
  # Merged multi-pass OCR (docs/08 section 0.1 follow-up): no single PSM mode
  # wins on both D4 and D5's fonts/renderings, merging does. See config.py.
  tesseract_configs:
    - "--psm 11"
    - "--psm 12"
    - "--psm 6 -c load_system_dawg=0 -c load_freq_dawg=0"

wires:
  junction_dot_min_radius: 2
  junction_dot_max_radius: 5
  junction_dot_fill_ratio: 0.6    # min fraction of local disk that must be ink to count as a dot
  terminal_snap_radius: 30       # isotropic fallback, only used when a terminal
                                  # has no known pin direction (inferred terminals)
  terminal_directional_reach: 45 # px; search distance along a KNOWN pin direction —
                                  # can extend further than the isotropic radius since
                                  # the search is restricted to a narrow cone, not a
                                  # full circle, so false-positive risk stays low
  terminal_snap_cone_deg: 70     # full angular width of the directional search cone
  skeleton_prune_min_length: 3

validation:
  min_confidence: 0.5

output:
  outputs_dir: outputs
  pipeline_version: "0.1.0"
